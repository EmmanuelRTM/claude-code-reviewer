[project]
name = "claude-code-reviewer"
version = "0.1.0"
description = "Verification-first code review kit: Claude Code primitives plus GitHub Actions, installable into any repository."
requires-python = ">=3.9"
dependencies = []

# Installed with `python -m pip install --group dev` (pip 25.1 or newer) or `uv run --group dev`.
# The kit itself has no dependencies: the library that ships to target repositories is standard library only.
[dependency-groups]
dev = ["pytest>=7", "pyyaml>=6", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["kit/.claude/reviewkit/lib", ".", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["kit/.claude/reviewkit/lib", ".", "tests"]
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# UP006/UP007/UP035/UP045: keep typing.List/Optional spellings that run on Python 3.9.
# SIM105: an explicit try/except reads better than contextlib.suppress in cleanup paths.
ignore = ["UP006", "UP007", "UP035", "UP045", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["reviewkit", "installer", "fakes", "conftest", "support", "doctor_kit"]
