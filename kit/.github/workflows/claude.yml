# Claude on issues and pull requests
#
# Mention `@claude` in an issue or in a pull request conversation to have
# Claude implement an issue, fix a review finding or answer a question. It runs
# on a Claude subscription token; no API key is involved.
#
# The session follows the repository's verification contract (CLAUDE.md): it
# runs the project's checks, stamps commits with a `Verified-By` trailer and
# stops for a person after three failed fix rounds. Its pull requests are then
# reviewed by the Claude PR Review workflow like anyone else's.
#
# Why these triggers:
#   `issues` and `issue_comment` run this file from the default branch, so a
#   pull request cannot edit the workflow that holds the subscription token.
#   Mention `@claude` in the conversation tab of a pull request, not on a diff
#   line. To also react to diff-line comments and review bodies, add the
#   `pull_request_review_comment` and `pull_request_review` triggers below, and
#   know that those events run the workflow file from the pull request itself.
#
# `@claude review ...` is handled by the review workflow, not this one.
#
# Requires the Claude GitHub App (https://github.com/apps/claude) so that
# Claude's commits trigger CI and its comments are attributed to claude[bot].
name: Claude

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  # pull_request_review_comment:
  #   types: [created]
  # pull_request_review:
  #   types: [submitted]

permissions: {}

jobs:
  claude:
    name: Respond
    # Only people who belong to the repository start a run; the action checks
    # write access again before Claude does anything.
    if: >-
      (
        github.event_name == 'issue_comment'
        && contains(github.event.comment.body, '@claude')
        && !startsWith(github.event.comment.body, '@claude review')
        && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      ) || (
        github.event_name == 'issues'
        && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))
        && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Optional hardening: keep CLAUDE_CODE_OAUTH_TOKEN as an environment secret
    # restricted to the default branch, then uncomment the next line.
    # environment: claude-review
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Check out the default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      # Install the project's toolchain here if Claude should be able to run
      # its tests, for example actions/setup-node followed by `npm ci`.

      # Reads .claude/reviewkit.json from the default branch: the project's
      # check commands become runnable without approval and the contract is
      # appended to the system prompt.
      - name: Load the project contract
        id: contract
        run: python3 -I .claude/reviewkit/rk.py interactive args

      - name: Run Claude
        uses: anthropics/claude-code-action@f431adaf77e0fecf918431e75a2b5b45b85af002 # v1.0.283
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: ${{ steps.contract.outputs.claude_args }}
